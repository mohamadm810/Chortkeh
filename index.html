:root{color-scheme:light;--bg:#eef3e9;--surface:#fff;--surface2:#f6f8f3;--line:#dce5d8;--ink:#19372a;--muted:#748278;--green:#237b4a;--green2:#2e9258;--greenSoft:#e9f6ed;--red:#a84b3e;--redSoft:#f9ebe8;--cream:#fbfcf8;--shadow:0 10px 30px rgba(25,55,42,.08);--shadow2:0 18px 45px rgba(25,55,42,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;min-height:100vh;padding:0 0 28px;background:radial-gradient(circle at 50% -10%,#fff 0,#eef3e9 42%,#e9f0e4 100%);color:var(--ink);font-family:'Iranian Sans',Vazirmatn,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font-family:inherit}button{cursor:pointer}.wrap{max-width:480px;margin:auto;padding:12px 15px 0}
.topbar{padding:3px 3px 13px}.topbar-row{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brand-icon{width:38px;height:38px;filter:drop-shadow(0 4px 8px rgba(20,60,40,.12))}.topbar h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px}.header-actions{display:flex;align-items:center;gap:7px}.theme-btn,.quick-head-btn{height:40px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.82);color:var(--ink);box-shadow:0 4px 14px rgba(25,55,42,.05)}.theme-btn{width:40px;font-size:18px}.quick-head-btn{padding:0 12px;font-size:11px;font-weight:800;color:var(--green)}
.total-card{position:relative;overflow:hidden;border-radius:25px;padding:18px 18px 15px;background:linear-gradient(135deg,#245d3d 0%,#19442e 100%);color:#fff;box-shadow:var(--shadow2);min-height:154px}.total-card:before{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.08);border-radius:50%;left:-105px;top:-82px;box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 45px rgba(255,255,255,.018)}.total-card:after{content:"";position:absolute;right:-28px;bottom:-55px;width:125px;height:125px;border-radius:50%;background:rgba(255,255,255,.055)}.total-content{position:relative;z-index:2}.total-label{display:block;font-size:11px;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:4px}.total-amount{display:flex;align-items:baseline;justify-content:center;gap:7px;line-height:1.05;direction:ltr;unicode-bidi:isolate}.total-amount #totalAmount{font-size:36px;font-weight:900;letter-spacing:-1px;color:#fff}.total-amount .unit{font-size:11px;color:rgba(255,255,255,.7)}
.abacus-art{position:absolute;left:17px;top:13px;width:112px;height:66px;opacity:.9;transform:rotate(-3deg)}.abacus-art .rod{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.26);border-radius:3px}.abacus-art .r1{top:15px}.abacus-art .r2{top:32px}.abacus-art .r3{top:49px}.bead{position:absolute;width:14px;height:14px;border-radius:50%;background:#d77b68;box-shadow:inset 2px 2px 3px rgba(255,255,255,.18),0 2px 4px rgba(0,0,0,.12)}.b1{left:21px;top:8px}.b2{left:43px;top:8px;background:#e9c985}.b3{left:72px;top:25px}.b4{left:55px;top:42px;background:#e9c985}.b5{left:84px;top:42px}.total-card .chips{position:relative;z-index:2;display:flex;gap:7px;overflow-x:auto;justify-content:flex-start;flex-wrap:nowrap;margin:15px 0 0;padding-bottom:1px;scrollbar-width:none}.total-card .chips::-webkit-scrollbar{display:none}.total-card .chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);border-radius:12px;padding:7px 10px;font-size:10.5px;font-weight:700;white-space:nowrap}.total-card .chip[data-active="true"]{background:#fff;border-color:#fff;color:var(--green)}
.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 13px}.stat{position:relative;overflow:hidden;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:17px;padding:10px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 14px rgba(25,55,42,.04)}.stat:after{content:"";position:absolute;width:50px;height:50px;border-radius:50%;left:-20px;bottom:-24px;background:var(--greenSoft)}.stat.out:after{background:var(--redSoft)}.stat-icon{position:relative;z-index:1;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:900}.stat.in .stat-icon{background:var(--greenSoft);color:var(--green)}.stat.out .stat-icon{background:var(--redSoft);color:var(--red)}.stat-label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}.stat-value{font-size:13px;font-weight:900;direction:ltr;unicode-bidi:plaintext}
.quick-add{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;padding:13px 13px 12px;margin-bottom:18px;box-shadow:var(--shadow)}.quick-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.quick-title h2{margin:0;font-size:14px;font-weight:900}.quick-badge{font-size:9.5px;font-weight:700;color:var(--green);background:var(--greenSoft);padding:5px 8px;border-radius:9px}.add-form{display:flex;flex-direction:column;gap:9px}.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:7px}.type-btn{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:800}.type-btn[data-active="true"].add{background:var(--greenSoft);border-color:#afd8bc;color:var(--green)}.type-btn[data-active="true"].subtract{background:var(--redSoft);border-color:#e6bbb4;color:var(--red)}.amount-row{display:flex;gap:7px}.amount-row input,.field>input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);font-size:17px;font-weight:800;padding:0 13px;outline:none}.amount-row input{text-align:right}.amount-row input:focus,.field>input:focus{border-color:#74a98a;box-shadow:0 0 0 3px rgba(46,146,88,.09)}.mic-btn{width:48px;height:48px;flex:0 0 48px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);font-size:17px}.mic-btn[data-listening="true"]{background:var(--red);border-color:var(--red);color:#fff;animation:micPulse 1s ease-in-out infinite}@keyframes micPulse{0%,100%{opacity:1}50%{opacity:.55}}.voice-hint{font-size:9.5px;color:var(--muted);margin:0}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10.5px;color:var(--muted);font-weight:700}.field label span{font-weight:500}.person-picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.person-picker::-webkit-scrollbar{display:none}.person-picker .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:10px;padding:7px 10px;font-size:11px;font-weight:700}.person-picker .chip[data-active="true"]{background:var(--green);border-color:var(--green);color:#fff}.person-picker .add-chip{border-style:dashed}.add-btn{width:100%;height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:13px;font-weight:900;box-shadow:0 7px 17px rgba(35,123,74,.2);margin-top:1px}.add-btn:active{transform:scale(.99)}.form-error{color:var(--red);font-size:11px;margin:0}.status-note{text-align:center;font-size:10.5px;color:var(--green);background:var(--greenSoft);border-radius:11px;padding:8px;margin:9px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}.section-title{font-size:15px;font-weight:900;margin:0}.reset-btn{font-size:10px;color:var(--red);background:none;border:0;padding:5px}.entries-list{list-style:none;margin:0;padding:0;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 5px 18px rgba(25,55,42,.05)}.entries-list li{min-height:67px;display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line)}.entries-list li:last-child{border-bottom:0}.entry-icon{width:37px;height:37px;flex:0 0 37px;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:900}.entry-icon.add{background:var(--greenSoft);color:var(--green)}.entry-icon.subtract{background:var(--redSoft);color:var(--red)}.entry-main{min-width:0;flex:1}.entry-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.entry-person{font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-date{font-size:9.5px;color:var(--muted);margin-top:2px}.entry-reason{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-amount{font-size:14px;font-weight:900;direction:ltr;unicode-bidi:plaintext;white-space:nowrap}.entry-amount.add{color:var(--green)}.entry-amount.subtract{color:var(--red)}.del-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:transparent;color:#98a49d;font-size:16px;line-height:1}.empty-state{text-align:center;color:var(--muted);font-size:11px;background:rgba(255,255,255,.8);border:1px dashed var(--line);border-radius:15px;padding:18px 10px;margin:9px 0 0}.add-modal{display:none!important}.bottom-nav{display:none!important}.header-actions .quick-head-btn:active{transform:scale(.98)}
body.dark{--bg:#101712;--surface:#18221c;--surface2:#202b24;--line:#304038;--ink:#edf4ee;--muted:#a4b2a9;--green:#68c38a;--green2:#58ad76;--greenSoft:#193a27;--red:#e47b6c;--redSoft:#3b211e;--shadow:0 10px 30px rgba(0,0,0,.2);--shadow2:0 18px 45px rgba(0,0,0,.35)}body.dark{background:radial-gradient(circle at 50% -10%,#1c2820 0,#101712 60%)}body.dark .theme-btn,body.dark .quick-head-btn,body.dark .stat,body.dark .quick-add,body.dark .entries-list,body.dark .empty-state{background:rgba(24,34,28,.94)}body.dark .amount-row input,body.dark .field>input{background:#111812;color:var(--ink);-webkit-text-fill-color:var(--ink)}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}.total-amount #totalAmount{font-size:32px}.quick-head-btn{padding:0 9px}.stat{padding:9px}.quick-add{padding:12px 10px}}

.brand-mark span{position:absolute;width:8px;height:8px;border-radius:50%;background:#e7b56b;box-shadow:0 13px 0 #d87865,13px 7px 0 #d87865,13px 20px 0 #e7b56b,25px 13px 0 #d87865;left:11px;top:11px;box-shadow:0 13px 0 #d87865,13px 7px 0 #e7b56b,13px 20px 0 #d87865,25px 13px 0 #e7b56b}
.topbar h1{font-size:23px;letter-spacing:-.7px}

.quick-head-btn{height:42px;border-radius:14px;padding:0 14px;font-size:11px;box-shadow:0 8px 20px rgba(30,67,47,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.total-card{min-height:166px;border:0;border-radius:28px;padding:20px 19px 15px;background:
 linear-gradient(135deg,#2d7750 0%,#1e5538 48%,#153b29 100%);
 box-shadow:0 18px 38px rgba(24,74,47,.22),0 4px 8px rgba(24,74,47,.10),inset 0 1px 0 rgba(255,255,255,.18)}
.total-card:before{width:250px;height:250px;left:-150px;top:-130px;border:0;background:radial-gradient(circle,rgba(255,255,255,.11) 0 2px,transparent 3px);background-size:18px 18px;opacity:.55;box-shadow:none}
.total-card:after{right:-35px;bottom:-75px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,0) 68%);box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 44px rgba(255,255,255,.018)}
.total-content{padding-top:1px}
.total-label{font-size:11px;color:rgba(255,255,255,.66)}
.total-amount{justify-content:flex-start;margin-top:5px}
.total-amount #totalAmount{font-size:39px;text-shadow:0 4px 15px rgba(0,0,0,.16)}
.total-amount .unit{font-size:10px}
.abacus-art{left:auto;right:14px;top:12px;width:118px;height:76px;opacity:.95;transform:rotate(-5deg)}
.abacus-art .rod{height:3px;background:rgba(255,255,255,.28);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.abacus-art .r1{top:17px}.abacus-art .r2{top:36px}.abacus-art .r3{top:55px}
.bead{width:16px;height:16px;box-shadow:inset 2px 2px 4px rgba(255,255,255,.22),inset -2px -2px 3px rgba(0,0,0,.10),0 4px 8px rgba(0,0,0,.16)}
.total-card .chips{margin-top:17px}
.total-card .chip{border:0;background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.08)}
.total-card .chip[data-active="true"]{box-shadow:0 5px 12px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.8)}
.quick-stats{gap:10px;margin:11px 0 14px}
.stat{border:0;border-radius:18px;padding:11px 12px;background:rgba(255,255,255,.80);box-shadow:0 10px 22px rgba(32,70,48,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.stat-icon{width:34px;height:34px;border-radius:12px;box-shadow:0 5px 10px rgba(30,80,48,.08)}
.quick-add{border:0;border-radius:23px;background:rgba(255,255,255,.84);box-shadow:0 13px 30px rgba(28,67,45,.09),inset 0 1px 0 rgba(255,255,255,.95);padding:14px;margin-bottom:19px}
.quick-title{margin-bottom:11px}.quick-badge{box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.type-btn{height:43px;border:0;border-radius:13px;box-shadow:0 5px 12px rgba(31,70,47,.05),inset 0 1px 0 rgba(255,255,255,.8)}
.type-btn[data-active="true"].add{box-shadow:0 6px 14px rgba(35,123,74,.12),inset 0 1px 0 rgba(255,255,255,.8)}
.type-btn[data-active="true"].subtract{box-shadow:0 6px 14px rgba(168,75,62,.10),inset 0 1px 0 rgba(255,255,255,.8)}
.amount-row input,.field>input{border:0;background:#f8faf6;box-shadow:inset 0 1px 3px rgba(29,65,44,.07),0 0 0 1px rgba(210,222,207,.7);height:50px}
.amount-row input:focus,.field>input:focus{box-shadow:inset 0 1px 3px rgba(29,65,44,.06),0 0 0 3px rgba(46,146,88,.11),0 6px 14px rgba(35,123,74,.06)}
.mic-btn{border:0;background:linear-gradient(145deg,#ffffff,#edf3ea);box-shadow:0 7px 15px rgba(30,65,44,.10),inset 0 1px 0 rgba(255,255,255,.95);font-size:18px}
.mic-btn:active,.add-btn:active,.type-btn:active,.quick-head-btn:active,.theme-btn:active{transform:translateY(1px) scale(.985)}
.mic-btn[data-listening="true"]{box-shadow:0 0 0 5px rgba(168,75,62,.10),0 8px 18px rgba(168,75,62,.22)}
.add-btn{height:50px;border-radius:15px;box-shadow:0 10px 20px rgba(35,123,74,.22),inset 0 1px 0 rgba(255,255,255,.18);font-size:13px}
.person-picker .chip{border:0;box-shadow:0 4px 10px rgba(30,65,44,.05),inset 0 1px 0 rgba(255,255,255,.8)}
.entries-list{border:0;border-radius:21px;background:rgba(255,255,255,.86);box-shadow:0 12px 28px rgba(30,68,46,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.entries-list li{min-height:71px;border-bottom:1px solid rgba(218,228,215,.75)}
.entry-icon{box-shadow:0 5px 12px rgba(30,65,44,.07)}
.del-btn{border:0;background:#f5f7f3;box-shadow:0 4px 9px rgba(30,65,44,.06)}
.status-note{box-shadow:0 7px 16px rgba(30,65,44,.06)}
@media(max-width:360px){.brand-mark{width:39px;height:39px}.total-amount #totalAmount{font-size:34px}.abacus-art{right:8px;transform:scale(.9) rotate(-5deg);transform-origin:top right}.quick-head-btn{padding:0 10px}}
body.dark{background:radial-gradient(600px 300px at 50% -100px,rgba(63,125,83,.20),transparent 65%),linear-gradient(180deg,#152019,#0e1511)}
body.dark .theme-btn,body.dark .quick-head-btn,body.dark .stat,body.dark .quick-add,body.dark .entries-list,body.dark .empty-state{background:rgba(25,36,29,.86);box-shadow:0 12px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.05)}
body.dark .amount-row input,body.dark .field>input{background:#121a15;box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px rgba(53,70,59,.8)}
body.dark .mic-btn{background:linear-gradient(145deg,#263229,#1a241d)}

<body>
<div class="wrap">
<header class="topbar"><div class="topbar-row">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><i></i><b></b><em></em><span></span></div>
    <h1>چرتکه</h1>
  </div>
  <div class="header-actions"><button id="openAddBtn" class="quick-head-btn" type="button">＋ ثبت سریع</button><button id="themeBtn" class="theme-btn" type="button" aria-label="تغییر حالت نمایش">☾</button></div>
</div></header>

<section class="total-card">
  <div class="abacus-art"><i class="rod r1"></i><i class="rod r2"></i><i class="rod r3"></i><i class="bead b1"></i><i class="bead b2"></i><i class="bead b3"></i><i class="bead b4"></i><i class="bead b5"></i></div>
  <div class="total-content"><span class="total-label" id="totalLabel">جمع کل</span><div class="total-amount"><span id="totalAmount">۰</span><span class="unit">تومان</span></div><div class="chips" id="filterChips"></div></div>
</section>

<section class="quick-stats" aria-label="خلاصه"><div class="stat in"><div class="stat-icon">↑</div><div><span class="stat-label">اضافه‌شده</span><strong class="stat-value" id="incomeTotal">۰</strong></div></div><div class="stat out"><div class="stat-icon">↓</div><div><span class="stat-label">کسرشده</span><strong class="stat-value" id="expenseTotal">۰</strong></div></div></section>

<section class="quick-add" id="quickAddSection">
  <div class="quick-title"><h2>ثبت سریع تراکنش</h2><span class="quick-badge">همین‌جا ثبت کن</span></div>
  <form class="add-form" id="addForm">
    <div class="type-toggle" id="typeToggle"><button type="button" class="type-btn add" data-type="add" data-active="true">↑ اضافه به بدهی</button><button type="button" class="type-btn subtract" data-type="subtract" data-active="false">↓ کسر / پرداخت</button></div>
    <div class="field"><label for="amountInput">مبلغ</label><div class="amount-row"><input id="amountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="مثلاً ۵۰٬۰۰۰"><button type="button" class="mic-btn" id="voiceBtn" aria-label="افزودن با صدا">🎤</button></div><p class="voice-hint" id="voiceHint">میکروفون رو بزن و بگو: اسم، مبلغ، بابت چی</p></div>
    <div class="field"><label>طرف حساب</label><div class="person-picker" id="personPicker"></div></div>
    <div class="field"><label for="reasonInput">بابت چی؟ <span>(اختیاری)</span></label><input id="reasonInput" type="text" autocomplete="off" placeholder="مثلاً ناهار، تاکسی، خرید"></div>
    <button type="submit" class="add-btn">ثبت تراکنش</button><p class="form-error" id="formError" hidden></p>
  </form>
</section>

<section class="entries-section" id="entriesSection"><div class="section-head"><h2 class="section-title">تراکنش‌های اخیر</h2><button id="resetBtn" class="reset-btn" type="button">پاک کردن همه</button></div><ul class="entries-list" id="entriesList"></ul><p class="empty-state" id="emptyState">هنوز تراکنشی ثبت نشده؛ همین بالا شروع کن.</p></section>
<p class="status-note" id="statusNote" hidden></p>
</div>

<div class="add-modal" id="addModal" hidden><button id="closeAddBtn" type="button" aria-label="بستن">×</button></div>

<nav hidden><button id="homeNav" type="button"></button><button id="entriesNav" type="button"></button></nav>
<script>
(function(){
  var ENTRIES_KEY = 'ledger_entries_v1';
  var PEOPLE_KEY = 'ledger_people_v1';

  var entries = [];
  var people = [];
  var activeFilterPerson = null;   // which person's total is shown / list filtered by
  var selectedEntryPerson = null;  // which person the NEXT new entry will be attributed to
  var selectedType = 'add';        // 'add' (بدهکار میشه / سبز) or 'subtract' (پرداخت شد / قرمز)

  var totalLabelEl = document.getElementById('totalLabel');
  var totalAmountEl = document.getElementById('totalAmount');
  var filterChipsEl = document.getElementById('filterChips');
  var formEl = document.getElementById('addForm');
  var amountInput = document.getElementById('amountInput');
  var typeToggleEl = document.getElementById('typeToggle');
  var voiceBtn = document.getElementById('voiceBtn');
  var voiceHint = document.getElementById('voiceHint');
  var personPickerEl = document.getElementById('personPicker');
  var reasonInput = document.getElementById('reasonInput');
  var formError = document.getElementById('formError');
  var entriesListEl = document.getElementById('entriesList');
  var emptyStateEl = document.getElementById('emptyState');
  var resetBtn = document.getElementById('resetBtn');
  var statusNote = document.getElementById('statusNote');
  var incomeTotalEl = document.getElementById('incomeTotal');
  var expenseTotalEl = document.getElementById('expenseTotal');
  var addModal = document.getElementById('addModal');
  var openAddBtn = document.getElementById('openAddBtn');
  var closeAddBtn = document.getElementById('closeAddBtn');
  var entriesSection = document.getElementById('entriesSection');

  function toEnglishDigits(str){
    var fa = '۰۱۲۳۴۵۶۷۸۹';
    var ar = '٠١٢٣٤٥٦٧٨٩';
    return String(str).replace(/[۰-۹٠-٩]/g, function(ch){
      var i = fa.indexOf(ch);
      if(i === -1) i = ar.indexOf(ch);
      return i !== -1 ? String(i) : ch;
    });
  }

  function fmtAmount(n){
    var num = Number(n) || 0;
    return num.toLocaleString('en-US', {maximumFractionDigits: 2})
      .replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[Number(d)];})
      .replace(/,/g,'٬');
  }

  function fmtSigned(n){
    var num = Number(n) || 0;
    var sign = num < 0 ? '-' : '+';
    return sign + fmtAmount(Math.abs(num));
  }

  function fmtDate(ts){
    try{ return new Date(ts).toLocaleDateString('fa-IR', {month:'short', day:'numeric'}); }
    catch(e){ return ''; }
  }

  function showStatus(msg){
    statusNote.textContent = msg;
    statusNote.hidden = false;
  }

  async function storageGet(key){
    try{if(window.storage&&typeof window.storage.get==='function'){var r=await window.storage.get(key,false);if(r&&r.value)return r.value;}}catch(e){}
    try{return localStorage.getItem(key);}catch(e){return null;}
  }
  async function storageSet(key,value){
    try{if(window.storage&&typeof window.storage.set==='function'){await window.storage.set(key,value,false);return true;}}catch(e){}
    try{localStorage.setItem(key,value);return true;}catch(e){showStatus('ذخیره‌سازی در دسترس نیست.');return false;}
  }
  async function loadEntries(){
    try{var v=await storageGet(ENTRIES_KEY);entries=v?JSON.parse(v):[];if(!Array.isArray(entries))entries=[];
      if(!entries.length){try{var b=JSON.parse(localStorage.getItem(ENTRIES_KEY+'_backup')||'null');if(b&&Array.isArray(b.entries))entries=b.entries;}catch(e){}}
    }catch(e){entries=[];}
  }
  async function saveEntries(){
    await storageSet(ENTRIES_KEY,JSON.stringify(entries));
    try{localStorage.setItem(ENTRIES_KEY+'_backup',JSON.stringify({entries:entries,savedAt:Date.now()}));}catch(e){}
  }
  async function loadPeople(){
    try{var v=await storageGet(PEOPLE_KEY);people=v?JSON.parse(v):[];if(!Array.isArray(people))people=[];}catch(e){people=[];}
  }
  async function savePeople(){
    await storageSet(PEOPLE_KEY,JSON.stringify(people));
    try{localStorage.setItem(PEOPLE_KEY+'_backup',JSON.stringify({people:people,savedAt:Date.now()}));}catch(e){}
  }

  function personsWithEntries(){
    var set = {};
    entries.forEach(function(e){ if(e.person) set[e.person] = true; });
    return Object.keys(set);
  }

  function signedAmount(e){
    var n = Number(e.amount) || 0;
    return e.type === 'subtract' ? -n : n;
  }

  function personTotal(name){
    return entries.filter(function(e){ return e.person === name; })
                  .reduce(function(sum, e){ return sum + signedAmount(e); }, 0);
  }

  function grandTotal(){
    return entries.reduce(function(sum, e){ return sum + signedAmount(e); }, 0);
  }

  function renderPersonPicker(){
    personPickerEl.innerHTML = '';
    people.forEach(function(name){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = name;
      chip.setAttribute('data-active', selectedEntryPerson === name ? 'true' : 'false');
      chip.onclick = function(){
        selectedEntryPerson = (selectedEntryPerson === name) ? null : name;
        renderPersonPicker();
      };
      personPickerEl.appendChild(chip);
    });
    var addChip = document.createElement('button');
    addChip.type = 'button';
    addChip.className = 'chip add-chip';
    addChip.textContent = '+ شخص جدید';
    addChip.onclick = addNewPerson;
    personPickerEl.appendChild(addChip);
  }

  async function addNewPerson(){
    var name = window.prompt('اسم شخص رو بنویس:');
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    if(people.indexOf(name) === -1){
      people.push(name);
      await savePeople();
    }
    selectedEntryPerson = name;
    renderPersonPicker();
  }

  function renderFilterChips(){
    var persons = personsWithEntries();
    filterChipsEl.innerHTML = '';
    if(persons.length === 0) return;

    var allChip = document.createElement('button');
    allChip.type = 'button';
    allChip.className = 'chip';
    allChip.textContent = 'همه';
    allChip.setAttribute('data-active', activeFilterPerson === null ? 'true' : 'false');
    allChip.onclick = function(){ activeFilterPerson = null; renderTotals(); renderFilterChips(); renderEntries(); };
    filterChipsEl.appendChild(allChip);

    persons.forEach(function(name){
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = name + ' · ' + fmtSigned(personTotal(name));
      chip.setAttribute('data-active', activeFilterPerson === name ? 'true' : 'false');
      chip.onclick = function(){
        activeFilterPerson = (activeFilterPerson === name) ? null : name;
        renderTotals(); renderFilterChips(); renderEntries();
      };
      filterChipsEl.appendChild(chip);
    });
  }

  function renderTotals(){
    var total;
    if(activeFilterPerson){
      totalLabelEl.textContent = 'جمع ' + activeFilterPerson;
      total = personTotal(activeFilterPerson);
    } else {
      totalLabelEl.textContent = 'جمع کل';
      total = grandTotal();
    }
    totalAmountEl.textContent = fmtSigned(total);
    totalAmountEl.classList.remove('add','subtract');
    totalAmountEl.classList.add(total < 0 ? 'subtract' : 'add');

    var inTotal = entries.reduce(function(s,e){ return e.type === 'add' ? s + (Number(e.amount)||0) : s; },0);
    var outTotal = entries.reduce(function(s,e){ return e.type === 'subtract' ? s + (Number(e.amount)||0) : s; },0);
    incomeTotalEl.textContent = fmtAmount(inTotal);
    expenseTotalEl.textContent = fmtAmount(outTotal);
  }

  function renderEntries(){
    var visible = entries.slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    if(activeFilterPerson){
      visible = visible.filter(function(e){ return e.person === activeFilterPerson; });
    }

    entriesListEl.innerHTML = '';
    if(visible.length === 0){
      emptyStateEl.hidden = false;
      return;
    }
    emptyStateEl.hidden = true;

    visible.forEach(function(e){
      var li = document.createElement('li');

      var isSubtract = e.type === 'subtract';

      var icon = document.createElement('div');
      icon.className = 'entry-icon ' + (isSubtract ? 'subtract' : 'add');
      icon.textContent = isSubtract ? '↓' : '↑';

      var main = document.createElement('div');
      main.className = 'entry-main';

      var top = document.createElement('div');
      top.className = 'entry-top';

      var personLine = document.createElement('div');
      personLine.className = 'entry-person';
      personLine.textContent = e.person ? e.person : 'بدون نام';

      var amountEl = document.createElement('div');
      amountEl.className = 'entry-amount ' + (isSubtract ? 'subtract' : 'add');
      amountEl.textContent = (isSubtract ? '-' : '+') + fmtAmount(e.amount);

      top.appendChild(personLine);
      top.appendChild(amountEl);
      main.appendChild(top);

      var dateLine = document.createElement('div');
      dateLine.className = 'entry-date';
      dateLine.textContent = fmtDate(e.createdAt);
      main.appendChild(dateLine);

      if(e.reason){
        var reasonLine = document.createElement('div');
        reasonLine.className = 'entry-reason';
        reasonLine.textContent = e.reason;
        main.appendChild(reasonLine);
      }

      var right = document.createElement('div');
      right.className = 'entry-right';

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.setAttribute('aria-label', 'حذف');
      delBtn.textContent = '×';
      delBtn.onclick = function(){ removeEntry(e.id); };

      right.appendChild(delBtn);

      li.appendChild(icon);
      li.appendChild(main);
      li.appendChild(right);
      entriesListEl.appendChild(li);
    });
  }

  function renderAll(){
    renderTotals();
    renderFilterChips();
    renderEntries();
    renderPersonPicker();
  }

  async function addEntry(amount, person, reason, type){
    var entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      amount: amount,
      person: person || '',
      reason: reason || '',
      type: (type === 'subtract') ? 'subtract' : 'add',
      createdAt: Date.now()
    };
    entries.push(entry);
    await saveEntries();
    renderTotals();
    renderFilterChips();
    renderEntries();
    return entry;
  }

  async function ensurePerson(name){
    name = (name || '').trim();
    if(!name) return '';
    if(people.indexOf(name) === -1){
      people.push(name);
      await savePeople();
    }
    return name;
  }

  function setSelectedType(type){
    selectedType = (type === 'subtract') ? 'subtract' : 'add';
    var btns = typeToggleEl.querySelectorAll('.type-btn');
    btns.forEach(function(b){ b.setAttribute('data-active', b.getAttribute('data-type') === selectedType ? 'true' : 'false'); });
  }

  typeToggleEl.addEventListener('click', function(ev){
    var btn = ev.target.closest('.type-btn');
    if(!btn) return;
    setSelectedType(btn.getAttribute('data-type'));
  });

  async function removeEntry(id){
    entries = entries.filter(function(e){ return e.id !== id; });
    if(activeFilterPerson && !entries.some(function(e){ return e.person === activeFilterPerson; })){
      activeFilterPerson = null;
    }
    await saveEntries();
    renderTotals();
    renderFilterChips();
    renderEntries();
  }

  var voiceMode = false;

  amountInput.addEventListener('input', function(){
    if(voiceMode) return;
    var v = toEnglishDigits(amountInput.value);
    v = v.replace(/[^0-9.]/g, '');
    var parts = v.split('.');
    if(parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
    amountInput.value = v;
  });

  formEl.addEventListener('submit', async function(ev){
    ev.preventDefault();
    formError.hidden = true;

    if(voiceMode){
      submitVoiceFromAmount();
      return;
    }

    var raw = toEnglishDigits(amountInput.value).trim();
    var amount = parseFloat(raw);
    if(!raw || isNaN(amount) || amount <= 0){
      formError.textContent = 'یه مبلغ درست وارد کن.';
      formError.hidden = false;
      amountInput.focus();
      return;
    }

    var reason = reasonInput.value.trim();
    await addEntry(amount, selectedEntryPerson, reason, selectedType);
    amountInput.value = '';
    reasonInput.value = '';
    selectedEntryPerson = null;
    renderPersonPicker();
    closeAddModal();
  });

  resetBtn.addEventListener('click', async function(){
    if(entries.length === 0) return;
    var ok = window.confirm('همه تراکنش‌ها پاک بشن؟ این کار قابل برگشت نیست.');
    if(!ok) return;
    entries = [];
    activeFilterPerson = null;
    await saveEntries();
    renderTotals();
    renderFilterChips();
    renderEntries();
  });

  var NUMBER_UNITS = {
    'صفر':0,'یک':1,'یه':1,'یکم':1,'دو':2,'سه':3,'چهار':4,'چار':4,'پنج':5,'شش':6,'شیش':6,'هفت':7,'هشت':8,'نه':9,
    'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'چارده':14,'پانزده':15,'پونزده':15,'شانزده':16,'شونزده':16,
    'هفده':17,'هجده':18,'هیجده':18,'نوزده':19,
    'بیست':20,'سی':30,'چهل':40,'پنجاه':50,'شصت':60,'هفتاد':70,'هشتاد':80,'نود':90,
    'صد':100,'یکصد':100,'دویست':200,'سیصد':300,'چهارصد':400,'چارصد':400,'پانصد':500,'پونصد':500,
    'ششصد':600,'شیشصد':600,'هفتصد':700,'هشتصد':800,'هشصد':800,'نهصد':900,'نوصد':900,
    'هزار':1000,'میلیون':1000000,'میلیارد':1000000000
  };
  var NUMBER_WORD_SET = Object.keys(NUMBER_UNITS);

  var SUBTRACT_HINTS = ['پرداخت کرد','پرداخت شد','پرداخت کردم','پرداخت کردن','واریز کرد','واریز کردم','واریز شد','واریز کرده','ریخت به حسابم','ریخت حسابم','کارت به کارت کرد','کارت‌به‌کارت کرد','برگردوند','برگرداند','برگردونده','برگشت داد','پس داد','پس دادم','پس دادن','تسویه کرد','تسویه کردم','تسویه شد','حسابشو صاف کرد','حساب کرد','حساب کردم','صاف کرد','بدهیشو داد','بدهیش رو داد','بدهیش را داد','قرضشو داد','قرضش رو داد','قرضش را داد','طلبمو داد','طلبم رو داد','پولمو داد','پولمو پس داد','پول رو داد','بهم داد','بهم پرداخت کرد','بهم برگردوند','ازش گرفتم','ازش گرفتیم','گرفتم','گرفتیم','گرفت','داد ','دادن','دادند',' داد'];
  var STRIP_PHRASES = ['خرج کرد','خرج کردم','خرج شد','خرجش کردم','براش خرج کردم','قرض دادم','قرض دادم بهش','بهش قرض دادم','براش پرداخت کردم','پرداخت کردم براش','کارت کشیدم براش','پرداخت کرد','پرداخت شد','پرداخت کردم','پرداخت کردن','واریز کرد','واریز کردم','واریز شد','واریز کرده','ریخت به حسابم','ریخت حسابم','کارت به کارت کرد','کارت‌به‌کارت کرد','برگردوند','برگرداند','برگردونده','برگشت داد','پس داد','پس دادم','پس دادن','تسویه کرد','تسویه کردم','تسویه شد','حسابشو صاف کرد','حساب کرد','حساب کردم','صاف کرد','ثبت کن','ثبت شد','اضافه کن','کسر کن','بدهیشو داد','بدهیش رو داد','بدهیش را داد','قرضشو داد','قرضش رو داد','قرضش را داد','طلبمو داد','طلبم رو داد','پولمو داد','پولمو پس داد','پول رو داد','بهم داد','بهم پرداخت کرد','بهم برگردوند','ازش گرفتم','ازش گرفتیم'];
  var FILLER_WORDS = ['تومان','تومن','تومنه','ریال','بابت','بابتِ','لطفا','لطفاً','یه','یک','برای','به','از','با','رو','را','حساب','دفتر','بزن','ثبت','مبلغ','هم','که','واسه','واسش','براش','براشون','بهش','ازش','گرفتم','گرفتیم','گرفت','داد','دادن','دادند','و'];

  function detectType(rawText){
    for(var i=0;i<SUBTRACT_HINTS.length;i++){
      if(rawText.indexOf(SUBTRACT_HINTS[i].trim()) !== -1) return 'subtract';
    }
    return 'add';
  }

  function stripKnownWords(text){
    var out = text;
    STRIP_PHRASES.forEach(function(w){
      out = out.split(w).join(' ');
    });
    var words = out.split(/\s+/).filter(Boolean).filter(function(w){
      var bare = w.replace(/[َُِّْ،,.]/g,'');
      return FILLER_WORDS.indexOf(bare) === -1 && NUMBER_WORD_SET.indexOf(bare) === -1;
    });
    return words.join(' ').trim();
  }

  function findKnownPerson(rawText){
    for(var i=0;i<people.length;i++){
      if(people[i] && rawText.indexOf(people[i]) !== -1) return people[i];
    }
    return null;
  }

  async function parseAndAddFromVoice(rawTranscript){
    var normalized = normalizeVoiceText(rawTranscript).trim();
    normalized = normalized.replace(/(\d)[,\u066C](\d)/g, '$1$2');
    var amount = persianNumberToNumber(normalized);
    if(isNaN(amount) || amount<=0){
      showStatus('یه مبلغ تو صحبتت پیدا نشد، دوباره امتحان کن.');
      return;
    }
    var type = detectType(rawTranscript);

    // remove the amount phrase (digits) from the transcript; number WORDS
    // (fifty, thousand, ...) are removed inside stripKnownWords below via
    // exact-word filtering, since Persian text doesn't work with \b regex.
    var withoutAmount = normalized.replace(/\d+(?:\.\d+)?/,' ');
    withoutAmount = stripKnownWords(withoutAmount);

    var person = findKnownPerson(withoutAmount);
    var remaining = withoutAmount;
    if(person){
      remaining = remaining.split(person).join(' ').replace(/\s+/g,' ').trim();
    } else {
      var words = withoutAmount.split(/\s+/).filter(Boolean);
      if(words.length){
        person = words[0];
        remaining = words.slice(1).join(' ').trim();
      }
    }

    person = await ensurePerson(person);
    var reason = remaining.trim();

    await addEntry(amount, person, reason, type);
    showStatus((type === 'subtract' ? 'کسر شد: ' : 'اضافه شد: ') + fmtAmount(amount) + (person ? ' برای ' + person : '') + (reason ? ' بابت ' + reason : ''));
  }

  // Voice entry: Web Speech API when the browser permits it.
  // Note: Chrome/Android generally requires a secure context (HTTPS/localhost) for SpeechRecognition;
  // a plain offline content:// or file:// page may expose the API but refuse recognizer.start().
  function persianNumberToNumber(text){
    var t = String(text||'').toLowerCase().replace(/\u200c/g,' ');
    t = t.replace(/(\d)[,\u066C](\d)/g, '$1$2'); // strip thousands separators between digits (50,000 / ۵۰٬۰۰۰)
    t = t.replace(/[،,]/g,' ');
    var digit = t.match(/\d+(?:\.\d+)?/);
    if(digit) return parseFloat(digit[0]);
    var units=NUMBER_UNITS;
    var words=t.replace(/[()]/g,' ').split(/\s+/).filter(Boolean), total=0, current=0, found=false;
    for(var i=0;i<words.length;i++){
      var w=words[i].replace(/[َُِّْ]/g,'');
      if(units[w] == null) continue;
      found=true;
      var n=units[w];
      if(n===1000 || n===1000000 || n===1000000000){ current=(current||1)*n; total+=current; current=0; }
      else current+=n;
    }
    return found ? total+current : NaN;
  }
  function normalizeVoiceText(text){
    return String(text||'').replace(/[۰-۹٠-٩]/g,function(ch){return toEnglishDigits(ch);});
  }

  // The in-browser Web Speech API needs a secure origin (HTTPS/localhost) and
  // is unreliable when this file is opened directly. Instead, the mic button
  // switches the SAME amount field to a normal text keyboard (so the OS/Gboard
  // mic icon appears), lets you dictate the whole "name amount reason" line
  // into it, then parses it on Enter or a second tap — and switches the field
  // straight back to the fast numeric keypad for normal manual entry.
  function enterVoiceMode(){
    voiceMode = true;
    amountInput.value = '';
    amountInput.setAttribute('inputmode','text');
    amountInput.placeholder = 'بگو یا تایپ کن: اسم، مبلغ، بابت چی';
    amountInput.focus();
    voiceHint.textContent = 'کیبورد باز شد؛ میکروفونِ خودِ کیبورد رو بزن و بگو، بعد Enter رو بزن.';
  }

  function exitVoiceMode(){
    voiceMode = false;
    amountInput.value = '';
    amountInput.setAttribute('inputmode','decimal');
    amountInput.placeholder = 'مثلاً ۵۰٬۰۰۰';
    voiceHint.textContent = 'میکروفون رو بزن و بگو: اسم، مبلغ، بابت چی';
  }

  function submitVoiceFromAmount(){
    var val = amountInput.value.trim();
    if(!val){ amountInput.focus(); return; }
    var normalized = normalizeVoiceText(val).replace(/(\d)[,\u066C](\d)/g, '$1$2');
    var amount = persianNumberToNumber(normalized);
    if(isNaN(amount) || amount<=0){
      voiceHint.textContent = 'مبلغ پیدا نشد؛ یه بار دیگه بگو یا تایپ کن، مثلاً «علی پنجاه هزار بابت ناهار».';
      return;
    }
    parseAndAddFromVoice(val);
    exitVoiceMode();
  }

  voiceBtn.addEventListener('click', function(){
    voiceBtn.setAttribute('data-listening','true');
    setTimeout(function(){ voiceBtn.setAttribute('data-listening','false'); }, 700);
    if(!voiceMode){
      enterVoiceMode();
    } else if(amountInput.value.trim()){
      submitVoiceFromAmount();
    } else {
      amountInput.focus();
    }
  });
  amountInput.addEventListener('keydown', function(ev){
    if(voiceMode && ev.key === 'Enter'){ ev.preventDefault(); submitVoiceFromAmount(); }
  });
  amountInput.addEventListener('blur', function(){
    if(voiceMode && !amountInput.value.trim()) exitVoiceMode();
  });


  function openAddModal(){
    document.getElementById('quickAddSection').scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(function(){ amountInput.focus(); }, 180);
  }
  function closeAddModal(){}
  openAddBtn.addEventListener('click', openAddModal);
  closeAddBtn.addEventListener('click', closeAddModal);
  document.getElementById('homeNav').addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });
  document.getElementById('entriesNav').addEventListener('click', function(){ entriesSection.scrollIntoView({behavior:'smooth',block:'start'}); });

    var themeBtn=document.getElementById('themeBtn'),themeColor=document.getElementById('themeColor');
  function setTheme(mode){var dark=mode==='dark';document.body.classList.toggle('dark',dark);themeBtn.textContent=dark?'☀':'☾';themeColor.setAttribute('content',dark?'#121815':'#EAF1E4');try{localStorage.setItem('ledger_theme_v1',dark?'dark':'light');}catch(e){}}
  var savedTheme=null;try{savedTheme=localStorage.getItem('ledger_theme_v1');}catch(e){} setTheme(savedTheme==='dark'?'dark':'light');
  themeBtn.addEventListener('click',function(){setTheme(document.body.classList.contains('dark')?'light':'dark');});

  (async function init(){
    await loadEntries();
    await loadPeople();
    renderAll();
  })();
})();
